# Free website; full ML and persistent data stay on the laptop.
services:
  - type: web
    name: transitopt-free
    runtime: docker
    repo: https://github.com/devanand2008/ML-Model-Repo
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.gateway
    dockerContext: .
    healthCheckPath: /gateway/health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_ADMIN_ENABLED
        value: "true"
      - key: UPSTREAM_ADMIN_AUTHORIZATION
        sync: false
      - key: TUNNEL_URL
        sync: false
      - key: BRIDGE_TOKEN
        sync: false

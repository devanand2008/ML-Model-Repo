# Full ML deployment requires paid compute and a persistent disk.
# Review the displayed price in Render before creating this service.
services:
  - type: web
    name: transitopt-ml
    runtime: docker
    repo: https://github.com/devanand2008/ML-Model-Repo
    branch: main
    region: singapore
    plan: 2c-4g
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: commit
    disk:
      name: transitopt-storage
      mountPath: /app/storage
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PERSISTENT_STORAGE
        value: /app/storage
      - key: CLOUD_SEED_DIR
        value: /app/cloud-seed
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: LIVE_MAX_FPS
        value: "15"

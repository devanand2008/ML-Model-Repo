services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://visionx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/visionx
      AUTH_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_ENV: production
      GENERAL_MODEL: ${GENERAL_MODEL:-yolo26n.pt}
      HUMAN_MODEL: ${HUMAN_MODEL:-yolo26n.pt}
      SHIP_MODEL: ${SHIP_MODEL:-yolo26n.pt}
      CONTAINER_MODEL: ${CONTAINER_MODEL:-yolo26n.pt}
      TRANSIT_FORECAST_DIR: /app/data/forecasting
      TRANSIT_DEMAND_DATASET: /app/data/synthetic/transit_demand.csv.gz
    volumes:
      - weights:/app/weights
      - outputs:/app/outputs
      - reports:/app/reports
      - transit_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: visionx
      POSTGRES_USER: visionx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionx"]
      interval: 5s
      retries: 10
volumes:
  weights:
  outputs:
  reports:
  database:
  transit_data:
